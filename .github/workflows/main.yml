name: SQLPad release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code ${{ github.sha }}
        uses: actions/checkout@v4

      - name: Build
        uses: docker://node:20-slim
        with:
          entrypoint: bash
          args: .github/workflows/build.sh

      # actions/create-release and actions/upload-release-asset are archived;
      # the preinstalled gh CLI does both in one step.
      - name: Create release and upload archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" sqlpad.tar.gz \
            --title "Release $GITHUB_REF_NAME" \
            --verify-tag
