# Dependabot version updates.
#
# Major version bumps are ignored: they are planned and tracked as roadmap
# issues (see #23), where each gets its own migration work. Dependabot only
# proposes grouped minor/patch updates and GitHub Actions bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      server-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      client-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      root-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node major upgrades are handled deliberately (#1).
      - dependency-name: node
        update-types: ['version-update:semver-major']
